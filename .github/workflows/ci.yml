name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Disposable PostgreSQL for scripts/booking-concurrency.integration.mjs, which
    # needs real row locking (PGlite runs one transaction at a time).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      BETTER_AUTH_SECRET: ci-only-secret-that-is-at-least-32-bytes-long
      BETTER_AUTH_URL: http://127.0.0.1:3000
      VITE_BETTER_AUTH_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci intentionally enforces package.json/package-lock.json parity.
      - name: Install dependencies
        run: npm ci

      - name: Domain tests
        run: npm run test:domain

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Production smoke test
        run: npm run test:smoke
