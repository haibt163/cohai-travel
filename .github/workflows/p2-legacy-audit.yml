name: P2 Legacy Audit

on:
  push:
    branches: [main]
    paths:
      - "scripts/audit-legacy-dump.mjs"
      - "scripts/audit-legacy-dump.test.mjs"
      - "scripts/build-p2-inventory.mjs"
      - "docs/P2_MIGRATION_EXECUTION.md"
      - ".github/workflows/p2-legacy-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p2-legacy-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CoHai Travel
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download frozen legacy dump
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/haibt163/travel/main/data_vietaustravel \
            --output /tmp/data_vietaustravel

      - name: Run aggregate legacy audit
        run: |
          mkdir -p docs/generated
          node scripts/audit-legacy-dump.mjs \
            --input /tmp/data_vietaustravel \
            --output docs/generated/legacy-audit.json

      - name: Build sanitized P2 source inventory
        run: |
          node scripts/build-p2-inventory.mjs \
            --input /tmp/data_vietaustravel \
            --output docs/generated/p2-source-inventory.json

      - name: Validate audit and inventory output
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const report = JSON.parse(fs.readFileSync("docs/generated/legacy-audit.json", "utf8"));
          const inventory = JSON.parse(fs.readFileSync("docs/generated/p2-source-inventory.json", "utf8"));
          for (const key of ["rawRecordSamples", "piiExported", "credentialsImported", "customerBookingRowsExported"]) {
            if (report.safety?.[key] !== false && inventory.safety?.[key] !== false) throw new Error(`Safety flag ${key} is not false`);
          }
          if (report.source !== "haibt163/travel:data_vietaustravel") throw new Error("Unexpected audit source");
          if (inventory.source !== "haibt163/travel:data_vietaustravel") throw new Error("Unexpected inventory source");
          if (!inventory.postRecords?.length || !inventory.taxonomy?.length) throw new Error("Sanitized inventory is incomplete");
          console.log(JSON.stringify({ audit: report.wpPosts, inventory: inventory.summary }, null, 2));
          NODE

      - name: Upload P2 source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: p2-source-artifacts
          path: |
            docs/generated/legacy-audit.json
            docs/generated/p2-source-inventory.json
          if-no-files-found: error
          retention-days: 14
