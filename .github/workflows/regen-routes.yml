name: Regenerate route tree

on:
  push:
    branches: [main]
    paths:
      - 'src/routes/**'
      - 'src/routeTree.gen.ts'
      - '.github/workflows/regen-routes.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Commit generated route tree and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts
          rm .github/workflows/regen-routes.yml
          git add .github/workflows/regen-routes.yml
          git diff --cached --quiet && { echo "No route-tree changes."; exit 0; }
          git commit -m "Regenerate TanStack route tree"
          git push
